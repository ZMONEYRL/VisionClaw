name: Build VisionClaw (unsigned IPA)

# Same approach as the JamesGlasses build: unsigned .ipa, no Apple secrets
# in the repo. Sideloadly does the real code-signing on your own PC using
# your own Apple ID. The only secret this workflow needs is your Gemini
# API key, stored as a GitHub Actions secret (never committed).
on:
  push:
    branches: [main, master]
    paths:
      - "samples/CameraAccess/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: samples/CameraAccess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Secrets.swift from GitHub Actions secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCLAW_HOST: ${{ secrets.OPENCLAW_HOST }}
          OPENCLAW_PORT: ${{ secrets.OPENCLAW_PORT }}
          OPENCLAW_HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repo secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          cat > CameraAccess/Secrets.swift <<EOF
          import Foundation

          enum Secrets {
            static let geminiAPIKey = "${GEMINI_API_KEY}"
            static let cloudGatewayURL = "https://api.visionagents.app"
            static let cloudGatewayToken = ""
            static let openClawHost = "${OPENCLAW_HOST:-http://YOUR_MAC_HOSTNAME.local}"
            static let openClawPort = ${OPENCLAW_PORT:-18789}
            static let openClawHookToken = "${OPENCLAW_HOOK_TOKEN:-}"
            static let openClawGatewayToken = "${OPENCLAW_GATEWAY_TOKEN:-}"
          }
          EOF

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess

      - name: Build (unsigned, for a real iPhone)
        run: |
          xcodebuild build \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under build/Build/Products — see the build step above."
            find build/Build/Products -maxdepth 3
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload out
          cp -R "$APP_PATH" Payload/
          zip -r out/VisionClaw.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-unsigned-ipa
          path: samples/CameraAccess/out/VisionClaw.ipa
          retention-days: 30
